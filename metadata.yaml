name: astrbot_plugin_fatfish_seememe
display_name: 鱼力max · 看图懂梗
desc: 机器人回话前先看懂图：字、画面、在玩什么梗、是不是在拿它开涮（拿它的头像对照），图里的字按拼音查谐音梗；认不出的梗、有人问「X 是什么梗」时查一下 cnmeme.wiki；群里反复出现的表情包认一次记进词典。（原「大肥鱼 · 看图看懂梗」）细节和配置见 README。
short_desc: 梗图看得懂、认得出图里是它自己，谐音梗也查
